name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint (ruff)
        run: |
          ruff check scripts/ --ignore E501,E402,F401 || true
      - name: Syntax check all scripts
        run: |
          python -m compileall scripts/ -q

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core deps
        run: |
          pip install pandas numpy pyarrow scikit-learn lightgbm
      - name: Run synthetic generator + feature engineering
        run: |
          python scripts/generate_synthetic.py --n 5000 --output data/synthetic/test.csv
          python scripts/feature_engineering.py --input data/synthetic/test.csv --output data/synthetic/test_feat.parquet
      - name: Run anomaly detection (quick)
        run: |
          python -c "import pandas as pd; df=pd.read_parquet('data/synthetic/test_feat.parquet'); df.sample(2000).to_parquet('data/synthetic/test_small.parquet')"
          python scripts/anomaly_detection.py --input data/synthetic/test_small.parquet --target Class --drop event_time customer_id merchant_id
